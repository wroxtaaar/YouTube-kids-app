<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<title>KidTube</title>
<style>
  :root{--bg:#fff;--bg2:#f2f2f2;--hover:#e5e5e5;--ink:#0f0f0f;--ink2:#606060;--line:#e5e5e5;--red:#ff7a00;--chip:#f2f2f2;--chipOn:#0f0f0f;--chipOnInk:#fff;--top:56px;--side:72px}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--bg2:#272727;--hover:#3f3f3f;--ink:#f1f1f1;--ink2:#aaa;--line:#3f3f3f;--chip:#272727;--chipOn:#f1f1f1;--chipOnInk:#0f0f0f}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Roboto,Arial,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  svg{display:block;fill:currentColor;flex:none}

  /* top bar */
  #top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);z-index:20}
  .icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
  .icon:hover{background:var(--hover)}
  #logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:20px;letter-spacing:-.8px;cursor:pointer}
  #logo i{width:28px;height:28px;background:linear-gradient(135deg,#ffb300,#ff6d00);border-radius:50%;display:grid;place-items:center}
  #logo i::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:3px}

  /* side rail + drawer */
  #side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);padding:4px;background:var(--bg);z-index:15;display:flex;flex-direction:column}
  .nav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;font-size:10px}
  .nav:hover{background:var(--hover)}
  .nav.on svg{fill:var(--ink)}.nav.on{font-weight:700}
  body.wide #side{width:240px}
  body.wide .nav{flex-direction:row;gap:22px;padding:10px 12px;font-size:14px;align-items:center}
  body.wide .nav.on{background:var(--bg2)}

  /* home */
  #home{position:absolute;top:var(--top);bottom:0;left:var(--side);right:0;overflow-y:auto}
  body.wide #home{left:240px}
  #chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:12px;padding:12px 24px;overflow-x:auto}
  .chip{background:var(--chip);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}
  .chip:hover{background:var(--hover)}.chip.on{background:var(--chipOn);color:var(--chipOnInk)}
  #feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 16px;padding:12px 24px 80px}
  .vid{text-align:left;display:block;width:100%}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--bg2) center/cover no-repeat;overflow:hidden}
  .thumb.ph{display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#3ea6ff,#9b59ff)}
  .vid:hover .thumb{border-radius:0;transition:border-radius .2s .1s}
  .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
  .meta{display:flex;gap:12px;margin-top:12px}
  .av{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .t{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c{font-size:14px;color:var(--ink2);margin-top:4px}

  /* shorts strip in home */
  .strip{grid-column:1/-1;min-width:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
  .strip h2{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:8px}
  .strip h2 svg{fill:var(--red)}
  .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .sc{flex:0 0 200px;text-align:left}
  .sc .st{aspect-ratio:9/16;border-radius:12px;background:var(--bg2) center/cover no-repeat}
  .sc .t{font-size:14px;line-height:20px;margin-top:8px}

  /* shorts player page */
  #shorts{position:absolute;top:var(--top);bottom:0;left:var(--side);right:0;background:var(--bg);display:none}
  body.wide #shorts{left:240px}
  body.view-shorts #shorts{display:block}body.view-shorts #home{display:none}
  #sscroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
  #sscroll::-webkit-scrollbar{display:none}
  .si{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:8px 0}
  .sf{position:relative;height:100%;max-height:calc(100vh - var(--top) - 16px);aspect-ratio:9/16;max-width:100%;border-radius:16px;overflow:hidden;background:#000 center/cover no-repeat}
  .sf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sf .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
  .sf .cap b{display:block;font-size:15px;font-weight:500;line-height:20px;margin-top:6px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .sf .cap span{font-size:14px;font-weight:600}
  .arrows{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;z-index:3}
  .arrows .icon{width:48px;height:48px;background:var(--bg2)}
  .arrows .icon:hover{background:var(--hover)}
  #sempty{display:none;height:100%;place-items:center;text-align:center;padding:24px;color:var(--ink2)}

  /* watch overlay */
  #watch{position:fixed;inset:var(--top) 0 0 0;background:var(--bg);z-index:30;display:none;overflow-y:auto}
  #watch.on{display:block}
  #wbox{max-width:1280px;margin:0 auto;padding:24px}
  #wbox .p{aspect-ratio:16/9;max-height:calc(100vh - 190px);width:100%;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
  #wbox iframe,#wbox video{width:100%;height:100%;border:0;display:block}
  #wt{font-size:20px;font-weight:700;margin:12px 0 4px;line-height:28px}
  #wc{color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:12px}
  #empty{padding:60px 24px;text-align:center;color:var(--ink2);font-size:16px}
  #sentinel{height:1px}

  /* phone: bottom tab bar */
  @media (max-width:700px){
    :root{--side:0px}
    #top{padding:0 8px}
    #menu{display:none}
    #side{top:auto;bottom:0;left:0;right:0;width:auto;height:56px;flex-direction:row;justify-content:space-around;padding:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(56px + env(safe-area-inset-bottom))}
    body.wide #side{width:auto}
    body.wide .nav{flex-direction:column;gap:4px;font-size:10px;padding:8px 20px}body.wide .nav.on{background:none}
    #home{bottom:calc(56px + env(safe-area-inset-bottom));left:0}body.wide #home{left:0}
    #shorts{bottom:calc(56px + env(safe-area-inset-bottom));left:0}body.wide #shorts{left:0}
    #feed{grid-template-columns:minmax(0,1fr);gap:24px;padding:0 0 80px}
    .vid .thumb{border-radius:0}.meta{padding:0 12px}
    #chips{padding:12px}
    .strip{padding:12px}
    .sf{max-height:none;height:100%;border-radius:0;aspect-ratio:auto;width:100%}
    .si{padding:0}
    .arrows{display:none}
    #wbox{padding:0}#wbox .p{border-radius:0}#wt,#wc{padding:0 12px}
  }
</style>
</head>
<body>
<div id="top">
  <button class="icon" id="menu" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg></button>
  <div id="logo"><i></i>KidTube</div>
</div>

<nav id="side">
  <button class="nav on" data-go="home"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></svg><span>Home</span></button>
  <button class="nav" data-go="shorts"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 2h8a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zm0 1.5A1.5 1.5 0 0 0 6.5 5v14A1.5 1.5 0 0 0 8 20.5h8a1.5 1.5 0 0 0 1.5-1.5V5A1.5 1.5 0 0 0 16 3.5H8zM10 8.5l5.5 3.5-5.5 3.5v-7z"/></svg><span>Shorts</span></button>
</nav>

<main id="home">
  <div id="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="home">Home videos</button></div>
  <div id="feed"></div>
  <div id="sentinel"></div>
  <div id="empty" hidden>No videos yet. Ask a parent to add some! 🌈</div>
</main>

<section id="shorts">
  <div id="sscroll"></div>
  <div id="sempty">No Shorts yet.<br>Ask a parent to add some!</div>
  <div class="arrows">
    <button class="icon" id="up" aria-label="Previous"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M18.4 14.8L12 8.4l-6.4 6.4-.7-.7L12 7l7.1 7.1z"/></svg></button>
    <button class="icon" id="down" aria-label="Next"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5.6 9.2L12 15.6l6.4-6.4.7.7L12 17 4.9 9.9z"/></svg></button>
  </div>
</section>

<div id="watch"><div id="wbox"><div class="p" id="wp"></div><div id="wt"></div><div id="wc"></div></div></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var feed=$('feed'),sent=$('sentinel'),empty=$('empty'),watch=$('watch'),wp=$('wp');
  var all=[],list=[],shorts=[],shown=0,PAGE=12,seed=Date.now(),filter='all',cur=-1,ready=false;
  var COLORS=['#e53935','#8e24aa','#3949ab','#039be5','#00897b','#7cb342','#f9a825','#f4511e','#6d4c41','#546e7a'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function chan(v){return v.kind==='home'?'Family videos':(v.channel||'')}
  function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COLORS[Math.abs(h)%COLORS.length]}
  function avatar(v){var n=chan(v)||'?';return '<div class="av" style="background:'+color(n)+'">'+esc(n.charAt(0).toUpperCase())+'</div>'}

  /* ---------- home ---------- */
  function card(v){
    var b=document.createElement('button');b.className='vid';
    b.innerHTML='<div class="thumb'+(v.thumb?'':' ph')+'"'+(v.thumb?' style="background-image:url(\''+esc(v.thumb)+'\')"':'')+'>'+(v.thumb?'':'🎬')
      +(v.duration?'<span class="dur">'+esc(v.duration)+'</span>':'')+'</div>'
      +'<div class="meta">'+avatar(v)+'<div><div class="t">'+esc(v.title)+'</div><div class="c">'+esc(chan(v))+'</div></div></div>';
    b.onclick=function(){play(v)};return b;
  }
  function strip(v){
    var d=document.createElement('div');d.className='strip';
    d.innerHTML='<h2><svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 2h8a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zm0 1.5A1.5 1.5 0 0 0 6.5 5v14A1.5 1.5 0 0 0 8 20.5h8a1.5 1.5 0 0 0 1.5-1.5V5A1.5 1.5 0 0 0 16 3.5H8zM10 8.5l5.5 3.5-5.5 3.5v-7z"/></svg>Shorts</h2>';
    var r=document.createElement('div');r.className='row';
    v.items.forEach(function(x){var b=document.createElement('button');b.className='sc';
      b.innerHTML='<div class="st" style="background-image:url(\''+esc(x.thumb)+'\')"></div><div class="t">'+esc(x.title)+'</div>';
      b.onclick=function(){goShorts(shorts.indexOf(x)>=0?shorts.indexOf(x):0)};r.appendChild(b)});
    d.appendChild(r);return d;
  }
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  // a fresh shuffled round: all videos mixed, a Shorts strip every 8 cards
  function makeRound(){
    var vids=shuf(all.filter(function(v){return v.kind!=='shorts'&&(filter==='all'||v.kind==='home')}));
    if(filter!=='all'||!baseShorts||!baseShorts.length)return vids;
    var pool=shuf(baseShorts),pi=0,out=[];
    vids.forEach(function(v,i){
      out.push(v);
      if(i%8===3){var it=[];for(var k=0;k<6;k++){if(pi>=pool.length){pool=shuf(baseShorts);pi=0}it.push(pool[pi++])}
        out.push({kind:'shorts',id:'sr'+Math.random(),items:it})}
    });
    return out;
  }
  function more(){
    if(shown>=list.length&&list.length){var r=makeRound();if(r.length)list=list.concat(r)}
    var end=Math.min(shown+PAGE,list.length);
    for(;shown<end;shown++)feed.appendChild(list[shown].kind==='shorts'?strip(list[shown]):card(list[shown]));
    sent.style.display=list.length?'block':'none';
  }
  function applyFilter(){
    feed.innerHTML='';shown=0;
    list=filter==='home'?all.filter(function(v){return v.kind==='home'}):all;
    empty.hidden=list.length>0;$('home').scrollTop=0;more();fill();
  }
  document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});c.classList.add('on');
    filter=c.dataset.f;applyFilter()}});
  // keep adding cards while the end of the feed is near the viewport (endless)
  function fill(){
    var h=$('home'),n=0;
    while(n++<8&&list.length&&sent.getBoundingClientRect().top<h.getBoundingClientRect().bottom+800){var before=feed.children.length;more();if(feed.children.length===before)break}
  }
  $('home').addEventListener('scroll',fill,{passive:true});
  window.addEventListener('resize',fill);
  new IntersectionObserver(function(e){if(e[0].isIntersecting)fill()},{root:$('home'),rootMargin:'800px'}).observe(sent);

  /* ---------- watch (normal videos) ---------- */
  function play(v){
    wp.innerHTML='';var el;
    if(v.kind==='youtube'){el=document.createElement('iframe');
      el.src='https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3';
      el.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';}
    else if(v.provider==='direct'){el=document.createElement('video');el.src=v.src;el.controls=true;el.autoplay=true;el.playsInline=true;}
    else{el=document.createElement('iframe');el.src=v.embed;el.allow='autoplay; fullscreen';}
    el.setAttribute('allowfullscreen','');wp.appendChild(el);
    $('wt').textContent=v.title;$('wc').innerHTML=avatar(v)+'<span>'+esc(chan(v))+'</span>';
    watch.classList.add('on');history.pushState({w:1},'');
  }
  function closeWatch(){wp.innerHTML='';watch.classList.remove('on')}
  window.addEventListener('popstate',function(){if(watch.classList.contains('on'))closeWatch();else route()});

  /* ---------- shorts player ---------- */
  var sc=$('sscroll'),io=null;
  var baseShorts=null;
  function addItem(v,i){
    var d=document.createElement('div');d.className='si';d.dataset.i=i;
    d.innerHTML='<div class="sf" style="background-image:url(\''+esc(v.thumb)+'\')"><div class="cap"><span>'+esc(chan(v))+'</span><b>'+esc(v.title)+'</b></div></div>';
    sc.appendChild(d);if(io)io.observe(d);
  }
  // endless scroll: when near the end, append another shuffled round of the same Shorts
  function appendMore(){
    if(!baseShorts||!baseShorts.length)return;
    var round=baseShorts.slice();
    for(var i=round.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=round[i];round[i]=round[j];round[j]=t}
    // avoid the same Short twice in a row at the seam
    if(round.length>1&&round[0].id===shorts[shorts.length-1].id){round.push(round.shift())}
    round.forEach(function(v){shorts.push(v);addItem(v,shorts.length-1)});
  }
  function buildShorts(){
    if(!baseShorts)baseShorts=shorts.slice();
    sc.innerHTML='';
    $('sempty').style.display=shorts.length?'none':'grid';sc.style.display=shorts.length?'block':'none';
    shorts.forEach(function(v,i){addItem(v,i)});
    if(io)io.disconnect();
    io=new IntersectionObserver(function(es){es.forEach(function(e){
      var sf=e.target.firstChild;
      if(e.isIntersecting&&e.intersectionRatio>.6){setPlaying(e.target)}
      else if(!e.isIntersecting||e.intersectionRatio<.2){var f=sf.querySelector('iframe');if(f)f.remove()}
    })},{root:sc,threshold:[0,.2,.6,.9]});
    [].forEach.call(sc.children,function(c){io.observe(c)});
  }
  function setPlaying(item){
    var sf=item.firstChild;if(sf.querySelector('iframe'))return;
    var v=shorts[+item.dataset.i];cur=+item.dataset.i;
    if(cur>=shorts.length-3)appendMore();
    [].forEach.call(sc.querySelectorAll('iframe'),function(f){f.remove()});
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&loop=1&playlist='+v.id+'&controls=0&rel=0&playsinline=1&modestbranding=1&iv_load_policy=3&fs=0&disablekb=1';
    f.allow='autoplay; encrypted-media';sf.insertBefore(f,sf.firstChild);
  }
  function step(d){var n=Math.max(0,(cur<0?0:cur)+d);if(n>=shorts.length-3)appendMore();n=Math.min(n,shorts.length-1);var el=sc.children[n];if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  $('up').onclick=function(){step(-1)};$('down').onclick=function(){step(1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&watch.classList.contains('on')){history.back();return}
    if(!document.body.classList.contains('view-shorts'))return;
    if(e.key==='ArrowDown'){e.preventDefault();step(1)}if(e.key==='ArrowUp'){e.preventDefault();step(-1)}
  });

  /* ---------- navigation ---------- */
  function setNav(w){document.querySelectorAll('.nav').forEach(function(n){n.classList.toggle('on',n.dataset.go===w)})}
  function route(){
    var s=location.hash==='#/shorts';
    document.body.classList.toggle('view-shorts',s);setNav(s?'shorts':'home');
    if(!s)[].forEach.call(sc.querySelectorAll('iframe'),function(f){f.remove()});
    else if(ready){if(!sc.children.length)buildShorts();else{var c=sc.children[Math.max(cur,0)];if(c)c.scrollIntoView();[].forEach.call(sc.children,function(x){io.unobserve(x);io.observe(x)})}}
  }
  function goShorts(i){
    location.hash='#/shorts';
    setTimeout(function(){var c=sc.children[i||0];if(c){c.scrollIntoView();}},50);
  }
  document.querySelectorAll('.nav').forEach(function(n){n.onclick=function(){
    if(n.dataset.go==='shorts')goShorts(0);else{location.hash='';closeWatch();history.replaceState(null,'',location.pathname);route()}}});
  window.addEventListener('hashchange',route);
  $('logo').onclick=function(){closeWatch();history.replaceState(null,'',location.pathname);route()};
  $('menu').onclick=function(){document.body.classList.toggle('wide')};

  /* ---------- load ---------- */
  fetch('/api/feed?seed='+seed).then(function(r){return r.json()}).then(function(d){
    all=d;shorts=[];d.forEach(function(v){if(v.kind==='shorts')shorts=shorts.concat(v.items)});
    baseShorts=shorts.slice();ready=true;applyFilter();buildShorts();route();
  }).catch(function(){empty.hidden=false});
})();
</script>
</body>
</html>
